<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEADLINE - Application de Productivité</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3B82F6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DEADLINE">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/3B82F6/ffffff.png?text=D">

    <!-- Lien vers le fichier manifest.json externe -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F8F9FA',
                        ink: '#1E293B',
                        primary: '#3B82F6',
                        alternance: '#A0001A',
                        hbof: '#DCBC91',
                        ecole: '#3DCEC4',
                        perso: '#8B5CF6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            color: #1E293B;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-cream text-ink antialiased selection:bg-primary selection:text-white">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center shadow-sm overflow-hidden group-hover:scale-105 transition-transform">
                    <img src="https://i.ibb.co/NnrQfs5D/mascotte.png" alt="Mascotte" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/100x100/3B82F6/ffffff?text=D';">
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight tracking-tight text-ink">DEADLINE</h1>
                    <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Espace Perso</span>
                </div>
            </div>
            
            <nav class="hidden md:flex items-center space-x-1">
                <button onclick="router.navigate('home')" class="nav-btn-home px-4 py-2 rounded-xl text-sm font-medium transition-all hover:bg-slate-100 text-slate-700">Accueil</button>
                <button onclick="router.navigate('rubriques')" class="nav-btn-rubriques px-4 py-2 rounded-xl text-sm font-medium transition-all hover:bg-slate-100 text-slate-700">Rubriques</button>
                <button onclick="router.navigate('all-todos')" class="nav-btn-all-todos px-4 py-2 rounded-xl text-sm font-medium transition-all hover:bg-slate-100 text-slate-700">To-Do List</button>
                <button onclick="router.navigate('all-deadlines')" class="nav-btn-all-deadlines px-4 py-2 rounded-xl text-sm font-medium transition-all hover:bg-slate-100 text-slate-700">Deadlines</button>
            </nav>

            <div class="flex items-center space-x-2">
                <button onclick="openQuickAddModal()" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md shadow-primary/20 transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Ajout rapide</span>
                </button>
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Mobile dropdown menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-4 space-y-1">
            <button onclick="router.navigate('home'); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100">Accueil</button>
            <button onclick="router.navigate('rubriques'); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100">Rubriques</button>
            <button onclick="router.navigate('all-todos'); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100">To-Do List</button>
            <button onclick="router.navigate('all-deadlines'); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-xl text-sm font-medium hover:bg-slate-100">Deadlines</button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Vues dynamiques -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500">
            <p>© 2026 DEADLINE — Application de productivité personnelle</p>
            <div class="flex items-center space-x-4 mt-3 sm:mt-0">
                <span class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#A0001A]"></span><span>Alternance</span></span>
                <span class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#DCBC91]"></span><span>Hbof</span></span>
                <span class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#3DCEC4]"></span><span>École</span></span>
                <span class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#8B5CF6]"></span><span>Perso</span></span>
            </div>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Quick Add Modal -->
    <div id="quick-add-modal" class="fixed inset-0 z-50 bg-ink/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 transform transition-all border border-slate-100">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                <h3 class="font-bold text-lg text-ink flex items-center space-x-2">
                    <i class="fa-solid fa-bolt text-primary"></i>
                    <span>Ajout rapide</span>
                </h3>
                <button onclick="closeQuickAddModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form onsubmit="handleQuickAdd(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Type d'élément</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center justify-center p-3 border-2 border-slate-200 rounded-2xl cursor-pointer hover:border-primary transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/5">
                            <input type="radio" name="quick_type" value="todo" checked class="sr-only">
                            <span class="text-sm font-semibold flex items-center space-x-2">
                                <i class="fa-solid fa-check-circle text-primary"></i>
                                <span>To-Do List</span>
                            </span>
                        </label>
                        <label class="flex items-center justify-center p-3 border-2 border-slate-200 rounded-2xl cursor-pointer hover:border-primary transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/5">
                            <input type="radio" name="quick_type" value="deadline" class="sr-only">
                            <span class="text-sm font-semibold flex items-center space-x-2">
                                <i class="fa-solid fa-calendar-days text-primary"></i>
                                <span>Deadline</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Rubrique</label>
                    <select id="quick-rubrique" required class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary bg-white text-sm font-medium">
                        <option value="alternance">Alternance</option>
                        <option value="hbof">Hbof (Blog parfumerie)</option>
                        <option value="ecole">École (Narratiiv)</option>
                        <option value="perso">Perso</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Titre / Intitulé</label>
                    <input type="text" id="quick-title" required placeholder="Ex: Rédiger l'article..." class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Date</label>
                        <input type="date" id="quick-date" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Heure (optionnelle)</label>
                        <input type="time" id="quick-time" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Description (optionnelle)</label>
                    <textarea id="quick-desc" rows="2" placeholder="Détails..." class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm"></textarea>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeQuickAddModal()" class="flex-1 px-4 py-2.5 rounded-2xl border border-slate-200 text-slate-700 font-semibold text-sm hover:bg-slate-50">Annuler</button>
                    <button type="submit" class="flex-1 px-4 py-2.5 rounded-2xl bg-primary text-white font-semibold text-sm hover:bg-blue-600 shadow-md shadow-primary/20">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const STORAGE_KEY_TODOS = 'deadline_todos_v3';
        const STORAGE_KEY_DEADLINES = 'deadline_deadlines_v3';

        const RUBRIQUES_CONFIG = {
            alternance: {
                id: 'alternance',
                name: 'Alternance',
                color: '#A0001A',
                icon: 'fa-briefcase',
                desc: 'Missions en entreprise et projets pro'
            },
            hbof: {
                id: 'hbof',
                name: 'Hbof (Blog Parfumerie)',
                color: '#DCBC91',
                icon: 'fa-spray-can-sparkles',
                desc: 'Univers olfactif et articles de blog'
            },
            ecole: {
                id: 'ecole',
                name: 'École (Narratiiv)',
                color: '#3DCEC4',
                icon: 'fa-graduation-cap',
                desc: 'Cours, examens et projets de com'
            },
            perso: {
                id: 'perso',
                name: 'Perso',
                color: '#8B5CF6',
                icon: 'fa-heart',
                desc: 'Vie quotidienne, loisirs et projets persos'
            }
        };

        const defaultTodos = [
            { id: 't1', title: 'Préparer la réunion de suivi alternance', rubrique: 'alternance', date: '2026-11-18', time: '10:00', completed: false },
            { id: 't2', title: 'Rédiger l’article sur les notes de tête', rubrique: 'hbof', date: '2026-11-18', time: '14:00', completed: true },
            { id: 't3', title: 'Finaliser la maquette de campagne', rubrique: 'ecole', date: '2026-11-18', time: '16:00', completed: false },
            { id: 't4', title: 'Séance de sport et courses', rubrique: 'perso', date: '2026-11-18', time: '18:00', completed: false }
        ];

        const defaultDeadlines = [
            { id: 'd1', title: 'Rendu du dossier de stratégie de communication', rubrique: 'ecole', date: '2026-06-15', time: '09:00', desc: 'Dossier complet de 20 pages.' },
            { id: 'd2', title: 'Lancement collection été Hbof', rubrique: 'hbof', date: '2026-06-20', time: '10:00', desc: 'Publication articles et visuels.' },
            { id: 'd3', title: 'Bilan trimestriel entreprise', rubrique: 'alternance', date: '2026-06-30', time: '11:00', desc: 'Présentation powerpoint.' }
        ];

        let selectedDateFilter = new Date().toISOString().split('T')[0];

        function getTodos() {
            const data = localStorage.getItem(STORAGE_KEY_TODOS);
            if (!data) {
                localStorage.setItem(STORAGE_KEY_TODOS, JSON.stringify(defaultTodos));
                return defaultTodos;
            }
            return JSON.parse(data);
        }

        function saveTodos(todos) {
            localStorage.setItem(STORAGE_KEY_TODOS, JSON.stringify(todos));
        }

        function getDeadlines() {
            const data = localStorage.getItem(STORAGE_KEY_DEADLINES);
            if (!data) {
                localStorage.setItem(STORAGE_KEY_DEADLINES, JSON.stringify(defaultDeadlines));
                return defaultDeadlines;
            }
            return JSON.parse(data);
        }

        function saveDeadlines(deadlines) {
            localStorage.setItem(STORAGE_KEY_DEADLINES, JSON.stringify(deadlines));
        }

        let currentRoute = 'home';
        let routeParams = {};

        const router = {
            navigate: (route, params = {}) => {
                currentRoute = route;
                routeParams = params;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                render();
                updateActiveNav();
            }
        };

        function updateActiveNav() {
            document.querySelectorAll('header nav button').forEach(btn => {
                btn.classList.remove('bg-slate-100', 'text-primary', 'font-semibold');
            });
            const activeBtn = document.querySelector(`.nav-btn-${currentRoute}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-slate-100', 'text-primary', 'font-semibold');
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-white text-sm font-medium flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300 ${
                type === 'success' ? 'bg-emerald-600' : 'bg-primary'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openQuickAddModal(preselectRubrique = 'alternance') {
            document.getElementById('quick-rubrique').value = preselectRubrique;
            document.getElementById('quick-title').value = '';
            document.getElementById('quick-desc').value = '';
            document.getElementById('quick-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('quick-time').value = '';
            document.getElementById('quick-add-modal').classList.remove('hidden');
        }

        function closeQuickAddModal() {
            document.getElementById('quick-add-modal').classList.add('hidden');
        }

        function handleQuickAdd(e) {
            e.preventDefault();
            const type = document.querySelector('input[name="quick_type"]:checked').value;
            const rubrique = document.getElementById('quick-rubrique').value;
            const title = document.getElementById('quick-title').value;
            const desc = document.getElementById('quick-desc').value;
            const date = document.getElementById('quick-date').value || new Date().toISOString().split('T')[0];
            const time = document.getElementById('quick-time').value;

            if (type === 'todo') {
                const todos = getTodos();
                const newTodo = {
                    id: 'todo_' + Date.now(),
                    title,
                    rubrique,
                    date,
                    time,
                    completed: false
                };
                todos.unshift(newTodo);
                saveTodos(todos);
                scheduleNotificationIfNeeded(newTodo);
                showToast('To-Do ajoutée avec succès !');
            } else {
                const deadlines = getDeadlines();
                const newDeadline = {
                    id: 'deadline_' + Date.now(),
                    title,
                    rubrique,
                    date,
                    time: time || '09:00',
                    desc
                };
                deadlines.unshift(newDeadline);
                saveDeadlines(deadlines);
                scheduleNotificationIfNeeded(newDeadline);
                showToast('Deadline ajoutée avec succès !');
            }

            closeQuickAddModal();
            render();
        }

        function render() {
            const container = document.getElementById('app-content');
            if (!container) return;

            if (currentRoute === 'home') {
                container.innerHTML = renderHomeView();
            } else if (currentRoute === 'rubriques') {
                container.innerHTML = renderRubriquesView();
            } else if (currentRoute === 'rubrique-detail') {
                container.innerHTML = renderRubriqueDetailView(routeParams.rubriqueId);
            } else if (currentRoute === 'todos') {
                container.innerHTML = renderTodosView(routeParams.rubriqueId);
            } else if (currentRoute === 'deadlines') {
                container.innerHTML = renderDeadlinesView(routeParams.rubriqueId);
            } else if (currentRoute === 'all-todos') {
                container.innerHTML = renderAllTodosView();
            } else if (currentRoute === 'all-deadlines') {
                container.innerHTML = renderAllDeadlinesView();
            }
        }

        function renderHomeView() {
            const todos = getTodos();
            const deadlines = getDeadlines();
            
            const counts = {
                alternance: todos.filter(t => t.rubrique === 'alternance' && !t.completed).length,
                hbof: todos.filter(t => t.rubrique === 'hbof' && !t.completed).length,
                ecole: todos.filter(t => t.rubrique === 'ecole' && !t.completed).length,
                perso: todos.filter(t => t.rubrique === 'perso' && !t.completed).length
            };
            const totalTasks = counts.alternance + counts.hbof + counts.ecole + counts.perso;
            const getPct = (val) => totalTasks === 0 ? 0 : Math.round((val / totalTasks) * 100);

            const notifsEnabled = ('Notification' in window) && Notification.permission === 'granted';

            return `
                <div class="space-y-10">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center bg-white rounded-3xl p-8 shadow-sm border border-slate-200 relative overflow-hidden">
                        <div class="absolute -right-20 -top-20 w-80 h-80 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
                        
                        <div class="lg:col-span-7 space-y-4 z-10">
                            <span class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-primary/10 text-primary text-xs font-semibold tracking-wide">
                                <i class="fa-solid fa-sparkles"></i>
                                <span>Tableau de bord personnel</span>
                            </span>
                            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-ink">
                                Bonjour ! Prêt à organiser ta journée ?
                            </h2>
                            <p class="text-slate-600 text-base leading-relaxed">
                                DEADLINE centralise tes missions d'alternance, ton blog Hbof, ton école Narratiiv et tes projets persos en un seul endroit.
                            </p>
                            <div class="flex flex-wrap gap-3 pt-2">
                                <button onclick="toggleNotificationPermission()" class="bg-primary hover:bg-blue-600 text-white font-semibold px-6 py-3 rounded-2xl shadow-lg shadow-primary/20 transition-all flex items-center space-x-2">
                                    <i class="fa-solid ${notifsEnabled ? 'fa-bell-slash' : 'fa-bell'}"></i>
                                    <span>${notifsEnabled ? 'Désactiver les notifs' : 'Activer les notifs'}</span>
                                </button>
                            </div>
                        </div>

                        <div class="lg:col-span-5 flex flex-col items-center bg-slate-50 rounded-3xl p-6 border border-slate-100 relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
                            
                            <div class="relative flex items-center justify-center mb-3">
                                <div class="w-32 h-32 rounded-3xl bg-white shadow-xl shadow-primary/20 flex items-center justify-center p-2 border border-slate-200 transform hover:scale-105 transition-transform duration-300 overflow-hidden">
                                    <img src="https://i.ibb.co/NnrQfs5D/mascotte.png" alt="Mascotte Floko" class="w-full h-full object-cover rounded-2xl drop-shadow-md" onerror="this.onerror=null; this.src='https://placehold.co/200x200/3B82F6/ffffff?text=Floko';">
                                </div>
                                <span class="absolute -top-1 -right-1 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">Actif</span>
                            </div>
                            <h3 class="font-bold text-ink text-center text-lg mb-0.5">Floko</h3>
                            <p class="text-xs text-slate-500 text-center mb-5">Répartition dynamique de la charge</p>

                            <div class="w-full space-y-2">
                                <div class="flex justify-between text-xs font-semibold text-slate-600">
                                    <span>Charge par rubrique</span>
                                    <span>${totalTasks} éléments actifs</span>
                                </div>
                                <div class="h-4 w-full bg-slate-200 rounded-full overflow-hidden flex shadow-inner">
                                    <div style="width: ${getPct(counts.alternance)}%; background-color: #A0001A;" title="Alternance: ${counts.alternance}" class="transition-all duration-500"></div>
                                    <div style="width: ${getPct(counts.hbof)}%; background-color: #DCBC91;" title="Hbof: ${counts.hbof}" class="transition-all duration-500"></div>
                                    <div style="width: ${getPct(counts.ecole)}%; background-color: #3DCEC4;" title="École: ${counts.ecole}" class="transition-all duration-500"></div>
                                    <div style="width: ${getPct(counts.perso)}%; background-color: #8B5CF6;" title="Perso: ${counts.perso}" class="transition-all duration-500"></div>
                                </div>
                                <div class="grid grid-cols-2 gap-2 pt-2 text-xs font-medium text-slate-600">
                                    <div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#A0001A]"></span><span>Alternance (${counts.alternance})</span></div>
                                    <div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#DCBC91]"></span><span>Hbof (${counts.hbof})</span></div>
                                    <div class="flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#3DCEC4]"></span><span>École (${counts.ecole})</span></div>

        // --- GESTION DES NOTIFICATIONS 1H AVANT ---
        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showToast("Votre navigateur ne supporte pas les notifications.", "info");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    showToast("Notifications activées avec succès !");
                } else {
                    showToast("Permissions de notification refusées.", "info");
                }
                render();
            });
        }

        function toggleNotificationPermission() {
            if (!('Notification' in window)) {
                showToast("Votre navigateur ne supporte pas les notifications.", "info");
                return;
            }
            if (Notification.permission === 'granted') {
                showToast("Pour désactiver les notifs, veuillez modifier les paramètres de votre navigateur.", "info");
            } else {
                requestNotificationPermission();
            }
        }

        function scheduleNotificationIfNeeded(item) {
            if (!item.date || !item.time) return;
            if (!('Notification' in window)) return;

            const [year, month, day] = item.date.split('-').map(Number);
            const [hours, minutes] = item.time.split(':').map(Number);
            
            const eventTime = new Date(year, month - 1, day, hours, minutes, 0).getTime();
            const notifyTime = eventTime - (60 * 60 * 1000); 
            const now = Date.now();

            const delay = notifyTime - now;
            if (delay > 0) {
                setTimeout(() => {
                    if (Notification.permission === 'granted') {
                        new Notification("DEADLINE - Rappel", {
                            body: `Rappel : "${item.title}" commence dans 1 heure !`,
                            icon: "https://placehold.co/192x192/3B82F6/ffffff.png?text=D"
                        });
                    }
                }, delay);
            }
        }

        function initScheduledNotifications() {
            const todos = getTodos();
            const deadlines = getDeadlines();
            todos.forEach(t => scheduleNotificationIfNeeded(t));
            deadlines.forEach(d => scheduleNotificationIfNeeded(d));
        }

        function renderAllTodosView() {
            const todos = getTodos();
            const todayStr = new Date().toISOString().split('T')[0];
            
            if (typeof window.allTodosFilter === 'undefined') {
                window.allTodosFilter = todayStr;
            }
            
            const currentFilter = window.allTodosFilter;
            const filteredTodos = currentFilter === 'all' 
                ? todos 
                : todos.filter(t => t.date === currentFilter);

            return `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <div>
                        <button onclick="router.navigate('home')" class="text-sm font-semibold text-slate-500 hover:text-primary mb-2 inline-flex items-center space-x-1.5">
                            <i class="fa-solid fa-arrow-left"></i><span>Retour à l'accueil</span>
                        </button>
                        <h2 class="text-3xl font-extrabold text-ink">Toutes les To-Do Lists</h2>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Filtrer par date :</span>
                            <input type="date" value="${currentFilter === 'all' ? todayStr : currentFilter}" onchange="changeAllTodosFilter(this.value)" class="px-3 py-1.5 rounded-xl border border-slate-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-primary/20">
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeAllTodosFilter('${todayStr}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold ${currentFilter === todayStr ? 'bg-primary text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'} transition-all">Aujourd'hui</button>
                            <button onclick="changeAllTodosFilter('all')" class="px-3 py-1.5 rounded-xl text-xs font-semibold ${currentFilter === 'all' ? 'bg-primary text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'} transition-all">Voir tout</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-3">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-lg text-ink">Tâches (${filteredTodos.length})</h3>
                            <span class="text-xs font-semibold text-slate-400">${currentFilter === 'all' ? 'Toutes les dates' : 'Date : ' + currentFilter}</span>
                        </div>
                        ${filteredTodos.length === 0 ? '<p class="text-slate-400 text-center py-8">Aucune tâche enregistrée pour cette date.</p>' :
                          filteredTodos.map(t => {
                              const rub = RUBRIQUES_CONFIG[t.rubrique] || RUBRIQUES_CONFIG.alternance;
                              return `
                                  <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                                      <div class="flex items-center space-x-3">
                                          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodoPage('${t.id}')" class="w-5 h-5 rounded cursor-pointer" style="accent-color: ${rub.color}">
                                          <div>
                                              <span class="font-medium text-sm ${t.completed ? 'line-through text-slate-400' : 'text-ink'}">${t.title}</span>
                                              <span class="block text-xs text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${t.date}${t.time ? ' à ' + t.time : ''}</span>
                                          </div>
                                      </div>
                                      <span class="text-xs font-bold px-2.5 py-1 rounded-full" style="background-color: ${rub.color}20; color: ${rub.color}">${rub.name}</span>
                                  </div>
                              `;
                          }).join('')
                        }
                    </div>
                </div>
            `;
        }

        function changeAllTodosFilter(dateVal) {
            window.allTodosFilter = dateVal;
            render();
        }

        function renderAllDeadlinesView() {
            const deadlines = getDeadlines();
            return `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <div>
                        <button onclick="router.navigate('home')" class="text-sm font-semibold text-slate-500 hover:text-primary mb-2 inline-flex items-center space-x-1.5">
                            <i class="fa-solid fa-arrow-left"></i><span>Retour à l'accueil</span>
                        </button>
                        <h2 class="text-3xl font-extrabold text-ink">Toutes les Deadlines</h2>
                    </div>
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-3">
                        ${deadlines.length === 0 ? '<p class="text-slate-400 text-center py-8">Aucune deadline enregistrée.</p>' :
                          deadlines.map(d => {
                              const rub = RUBRIQUES_CONFIG[d.rubrique] || RUBRIQUES_CONFIG.alternance;
                              return `
                                  <div class="p-4 rounded-2xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                                      <div>
                                          <h4 class="font-semibold text-sm text-ink">${d.title}</h4>
                                          <p class="text-xs text-slate-500 mt-0.5"><i class="fa-regular fa-clock mr-1 text-primary"></i> ${d.date} ${d.time ? 'à ' + d.time : ''} ${d.desc ? '• ' + d.desc : ''}</p>
                                      </div>
                                      <span class="text-xs font-bold px-2.5 py-1 rounded-full" style="background-color: ${rub.color}20; color: ${rub.color}">${rub.name}</span>
                                  </div>
                              `;
                          }).join('')
                        }
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
            updateActiveNav();
            initScheduledNotifications();
            
            // Enregistrement du fichier sw.js externe
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
        };
    </script>
</body>
</html>
